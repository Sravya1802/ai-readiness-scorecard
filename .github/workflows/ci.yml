name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 resolves pandas 2.x, 3.12 resolves pandas 3.x; both must pass.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_no_data.py
      - run: ruff check .
      - run: ruff format --check .
      # Offline only: tests marked `network` hit the live GDC API and are deselected by default.
      - run: pytest -q
