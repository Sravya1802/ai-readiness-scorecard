[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-readiness-scorecard"
version = "0.1.0"
description = "Task-relative AI-readiness profiler for multimodal oncology datasets in the NCI Cancer Research Data Commons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["AI-readiness", "data quality", "oncology", "CRDC", "GDC", "TCGA"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[project.scripts]
scorecard = "scorecard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scorecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live repository APIs (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
