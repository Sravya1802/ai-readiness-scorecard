# Question 4 of 5 (Dr. Gadi): is ovarian suppression needed if ER+ and
# premenopausal?
#
# STATUS: DRAFT, short form. This file only tests whether the must-have
# variables exist (cohort and completeness checks). Every cutoff is a
# starting value.                                                     REVIEW

id: ovarian-suppression
number: 4
title: Ovarian suppression in ER+ premenopausal patients
question: Is ovarian suppression needed if the patient is ER+ and premenopausal?
description: >
  Quick pass: can premenopausal ER-positive patients be identified, and does
  the dataset record ovarian suppression, endocrine therapy and recurrence?
pack: oncology-completeness

clinical_review:
  status: draft
  reviewer: null
  review_date: null
  open_questions:
    - Should perimenopausal patients be included?
    - Is an age cutoff an acceptable stand-in when menopausal status is not recorded?

population:
  description: Female, ER-positive, premenopausal, stage I to III
  include:
    - {column: sex, op: in, values: [female]}
    - {column: er_status, op: in, values: [Positive]}
    - {column: menopausal_status, op: in, values: [premenopausal]}    # REVIEW
    - {column: stage_group, op: in, values: [I, II, III]}

variables:
  - {name: er_status, column: er_status, role: cohort}
  - {name: menopausal_status, column: menopausal_status, role: cohort}
  - {name: stage_group, column: ajcc_pathologic_stage, uninformative: [Stage X], role: cohort}
  - {name: age_at_diagnosis, column: age_at_index, role: predictor}
  - name: ovarian_suppression
    column: ovarian_suppression
    role: treatment
    note: Adapters can only record "yes" (a suppression drug is on record), so coverage here is the share recorded as treated.
  - {name: endocrine_therapy, column: endocrine_therapy, role: treatment}
  - name: endocrine_drug
    column: drug_names
    role: treatment
    expected_when: [{column: endocrine_therapy, op: in, values: ["yes"]}]
  - {name: chemotherapy, column: chemotherapy, role: treatment}
  - {name: nodes_positive, column: nodes_positive, role: predictor}
  - {name: tumor_size, any_of: [tumor_size_mm, ajcc_pathologic_t], uninformative: [TX], role: predictor}
  - {name: grade, column: tumor_grade, uninformative: [GX, Not Applicable], role: predictor}
  - {name: her2_status, column: her2_status, role: predictor}
  - name: distant_recurrence
    column: distant_recurrence_event
    role: outcome
    substitutes: [pfi_event, dfi_event]
  - {name: followup_time, column: os_time_days, role: outcome}

checks:
  - integrity.missingness
  - task_fit.cohort_identifiable
  - completeness.conditional

params:
  cohort_identifiable:
    decided_fraction: {pass: 0.90, warn: 0.75}
  conditional_completeness:
    required: {pass: 0.90, warn: 0.70}
    recommended: {pass: 0.70, warn: 0.40}
    # A required treatment or outcome variable the dataset does not carry at all
    # (and has no stand-in for) blocks the verdict: the question cannot be asked.
    blocking_if_absent_roles: [treatment, outcome]
